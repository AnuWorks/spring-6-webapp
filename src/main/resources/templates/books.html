<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>Spring 6 Webapp</head>
<body>
<h1>Book List</h1>
<table>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Publisher</th>
    </tr>
    <tr th:each="book : ${books}">
        <th th:text="${book.id}"></th>
        <th th:text="${book.title}"></th>
        <th th:text="${book.publisher.publisherName}"></th>
    </tr>
</table>
</body>
</html>
